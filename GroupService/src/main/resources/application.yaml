server:
  port: 8086

spring:
  application:
    name: GroupService

  datasource:
    url: jdbc:postgresql://localhost:5432/groupdb
    username: postgres
    password: 13102002

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"